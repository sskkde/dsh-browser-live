# dsh-browser-live bundle layer.
#
# Mounts the browser-use registry service and this plugin, which carries the
# per-session browser provider itself (lib/provider.js). The official
# exclusive attach row (`browser-use-playwright-mcp-neko`) is intentionally NOT
# inserted: browserUse is a single-slot registration, and the v0.1.0 insert row
# is simply gone — the official package is no longer mounted by any patch.
- insert:
    - id: browser-use-registry
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-live
      name: dsh-browser-live

# web-app bundle disables ui-sidebar-browser unless profileContext is desktop;
# the row's own comment marks web profiles as opt-in. The live panel below and
# the manual built-in browser tab share this seat.
- id: ui-sidebar-browser
  disabled: false
